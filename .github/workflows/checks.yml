name: checks
on:
  push:
  pull_request:
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: Browser checks
        working-directory: tests
        run: npm test
